<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLAUDE.md Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #0e0e0e;
–surface: #161616;
–border: #2a2a2a;
–border-bright: #3d3d3d;
–text: #e8e8e8;
–muted: #6b6b6b;
–accent: #c8f060;
–accent-dim: #8aaa2a;
–on-accent: #0e0e0e;
–tag-bg: #1f1f1f;
–active-block: #1a1f0e;
–active-border: #c8f060;
}

body {
background: var(–bg);
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
font-size: 14px;
line-height: 1.6;
min-height: 100vh;
}

/* HEADER */
header {
border-bottom: 1px solid var(–border);
padding: 20px 32px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
background: var(–bg);
z-index: 100;
}

.logo {
display: flex;
align-items: baseline;
gap: 10px;
}

.logo-text {
font-family: ‘DM Mono’, monospace;
font-size: 15px;
color: var(–accent);
letter-spacing: -0.02em;
}

.logo-sub {
font-family: ‘Instrument Serif’, serif;
font-style: italic;
color: var(–muted);
font-size: 13px;
}

.header-actions {
display: flex;
gap: 10px;
align-items: center;
}

.btn {
padding: 8px 16px;
border-radius: 6px;
border: 1px solid var(–border-bright);
background: transparent;
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
cursor: pointer;
transition: all 0.15s;
letter-spacing: 0.02em;
}

.btn:hover { border-color: var(–accent); color: var(–accent); }

.btn-primary {
background: var(–accent);
color: var(–on-accent);
border-color: var(–accent);
font-weight: 500;
}

.btn-primary:hover { background: #d9f570; color: var(–on-accent); border-color: #d9f570; }

/* LAYOUT */
.layout {
display: grid;
grid-template-columns: 280px 1fr 1fr;
height: calc(100vh - 61px);
}

/* LEFT PANEL - Block selector */
.panel-left {
border-right: 1px solid var(–border);
overflow-y: auto;
padding: 20px 16px;
}

.panel-label {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–muted);
letter-spacing: 0.12em;
text-transform: uppercase;
padding: 0 8px;
margin-bottom: 12px;
}

.block-item {
display: flex;
align-items: center;
gap: 10px;
padding: 9px 10px;
border-radius: 7px;
cursor: pointer;
border: 1px solid transparent;
margin-bottom: 3px;
transition: all 0.12s;
user-select: none;
}

.block-item:hover { background: var(–surface); border-color: var(–border); }

.block-item.active {
background: var(–active-block);
border-color: var(–active-border);
}

.block-toggle {
width: 16px;
height: 16px;
border-radius: 4px;
border: 1px solid var(–border-bright);
background: transparent;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: all 0.12s;
}

.block-item.active .block-toggle {
background: var(–accent);
border-color: var(–accent);
}

.block-toggle svg { display: none; }
.block-item.active .block-toggle svg { display: block; }

.block-info { flex: 1; min-width: 0; }

.block-name {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
color: var(–text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}

.block-item.active .block-name { color: var(–accent); }

.block-desc {
font-size: 11px;
color: var(–muted);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-top: 1px;
}

.section-divider {
font-family: ‘DM Mono’, monospace;
font-size: 9px;
color: var(–muted);
letter-spacing: 0.1em;
text-transform: uppercase;
padding: 14px 10px 6px;
opacity: 0.5;
}

/* MIDDLE PANEL - Editor */
.panel-mid {
border-right: 1px solid var(–border);
display: flex;
flex-direction: column;
}

.panel-header {
padding: 14px 20px;
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: space-between;
}

.panel-header .panel-label { margin: 0; }

.char-count {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–muted);
}

#editor {
flex: 1;
background: var(–surface);
border: none;
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
line-height: 1.8;
padding: 20px;
resize: none;
outline: none;
overflow-y: auto;
white-space: pre;
overflow-x: auto;
}

#editor::selection { background: rgba(200, 240, 96, 0.2); }

/* RIGHT PANEL - Preview */
.panel-right {
display: flex;
flex-direction: column;
}

.preview-body {
flex: 1;
padding: 24px 28px;
overflow-y: auto;
}

/* Markdown preview styles */
.preview-body h1 {
font-family: ‘Instrument Serif’, serif;
font-size: 24px;
color: var(–accent);
margin-bottom: 16px;
padding-bottom: 10px;
border-bottom: 1px solid var(–border);
font-weight: 400;
}

.preview-body h2 {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
color: var(–accent);
margin: 24px 0 10px;
opacity: 0.8;
}

.preview-body h3 {
font-family: ‘DM Sans’, sans-serif;
font-size: 13px;
font-weight: 500;
color: var(–text);
margin: 16px 0 6px;
}

.preview-body p {
color: #bbb;
font-size: 13px;
margin-bottom: 10px;
line-height: 1.7;
}

.preview-body code {
font-family: ‘DM Mono’, monospace;
font-size: 11px;
background: var(–tag-bg);
color: var(–accent);
padding: 1px 5px;
border-radius: 3px;
}

.preview-body pre {
background: var(–tag-bg);
border: 1px solid var(–border);
border-radius: 6px;
padding: 14px 16px;
margin: 10px 0;
overflow-x: auto;
}

.preview-body pre code {
background: none;
padding: 0;
color: #bbb;
font-size: 11px;
}

.preview-body ul, .preview-body ol {
padding-left: 18px;
margin-bottom: 10px;
color: #bbb;
font-size: 13px;
}

.preview-body li { margin-bottom: 4px; line-height: 1.6; }

.preview-body strong { color: var(–text); font-weight: 500; }

.preview-body hr {
border: none;
border-top: 1px solid var(–border);
margin: 20px 0;
}

.preview-body blockquote {
border-left: 2px solid var(–accent);
padding-left: 12px;
color: var(–muted);
font-style: italic;
margin: 10px 0;
}

/* Toast */
.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%) translateY(10px);
background: var(–accent);
color: var(–on-accent);
font-family: ‘DM Mono’, monospace;
font-size: 12px;
padding: 10px 20px;
border-radius: 6px;
opacity: 0;
transition: all 0.2s;
pointer-events: none;
z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(–border-bright); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(–muted); }

.select-all-row {
display: flex;
gap: 6px;
padding: 0 8px;
margin-bottom: 10px;
}

.mini-btn {
font-family: ‘DM Mono’, monospace;
font-size: 10px;
color: var(–muted);
border: 1px solid var(–border);
background: none;
padding: 3px 8px;
border-radius: 4px;
cursor: pointer;
transition: all 0.12s;
}
.mini-btn:hover { color: var(–accent); border-color: var(–accent); }
</style>

</head>

// ─── STATE ─────────────────────────────────────────────────────────────────────
let activeBlocks = new Set(BLOCKS.filter(b => b.default).map(b => b.id));

// ─── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  renderBlockList();
  rebuildEditor();
  syncPreview();
  updateCount();
}

function renderBlockList() {
  const container = document.getElementById('block-list');
  container.innerHTML = '';
  let currentGroup = null;

  BLOCKS.forEach(block => {
    if (block.group !== currentGroup) {
      currentGroup = block.group;
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.textContent = block.group;
      container.appendChild(div);
    }

    const item = document.createElement('div');
    item.className = 'block-item' + (activeBlocks.has(block.id) ? ' active' : '');
    item.dataset.id = block.id;
    item.onclick = () => toggleBlock(block.id);
    item.innerHTML = `
      <div class="block-toggle">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
          <path d="M1 4L3.5 6.5L9 1" stroke="#0e0e0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="block-info">
        <div class="block-name">${block.name}</div>
        <div class="block-desc">${block.desc}</div>
      </div>
    `;
    container.appendChild(item);
  });
}

function toggleBlock(id) {
  if (activeBlocks.has(id)) {
    activeBlocks.delete(id);
  } else {
    activeBlocks.add(id);
  }
  renderBlockList();
  rebuildEditor();
  syncPreview();
  updateCount();
}

function rebuildEditor() {
  const orderedActive = BLOCKS.filter(b => activeBlocks.has(b.id));
  const text = orderedActive.map(b => b.content.trim()).join('\n\n---\n\n');
  document.getElementById('editor').value = text;
}

function selectAll() {
  BLOCKS.forEach(b => activeBlocks.add(b.id));
  renderBlockList();
  rebuildEditor();
  syncPreview();
  updateCount();
}

function selectNone() {
  activeBlocks.clear();
  renderBlockList();
  rebuildEditor();
  syncPreview();
  updateCount();
}

// ─── PREVIEW ───────────────────────────────────────────────────────────────────
function syncPreview() {
  const raw = document.getElementById('editor').value;
  document.getElementById('preview').innerHTML = markdownToHtml(raw);
}

function markdownToHtml(md) {
  let html = md
    // Escape HTML
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${code.trim()}</code></pre>`)

```
// Inline code
.replace(/`([^`]+)`/g, '<code>$1</code>')
// HR
.replace(/^---$/gm, '<hr>')
// H1
.replace(/^# (.+)$/gm, '<h1>$1</h1>')
// H2

.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, (_, header, rows) => {
  const ths = header.split('|').filter(s => s.trim()).map(s => `<th>${s.trim()}</th>`).join('');
  const trs = rows.trim().split('\n').map(row => {
    const tds = row.split('|').filter(s => s.trim()).map(s => `<td>${s.trim()}</td>`).join('');
    return `<tr>${tds}</tr>`;

  return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;

function updateCount() {

document.getElementById(‘char-count’).textContent = len.toLocaleString() + ’ chars’;
}

function resetEditor() {
activeBlocks = new Set(BLOCKS.filter(b => b.default).map(b => b.id));
renderBlockList();
rebuildEditor();
syncPreview();
updateCount();
}

function copyToClipboard() {
const text = document.getElementById(‘editor’).value;
navigator.clipboard.writeText(text).then(() => {
const toast = document.getElementById(‘toast’);
toast.classList.add(‘show’);
setTimeout(() => toast.classList.remove(‘show’), 2000);
});
}
